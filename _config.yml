# Site settings
title: Swartzism
description: >
  A doctrine of information power, built from the record of Aaron Swartz. Axioms, ethics of scale, and the PII boundary — applied to public records, paywalls, procurement, and accountability. Apersonal by design: the doctrine belongs to no author, only to a record and an argument.
baseurl: "/swartzism"
url: "https://logicinczo.github.io"
author: "Swartzism"

# Build settings
markdown: kramdown
theme: null
permalink: /:year/:month/:title/
paginate: 10
paginate_path: "/page:num/"
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-paginate

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor

defaults:
  -
    scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  -
    scope:
      path: ""
      type: "pages"
    values:
      layout: "default"
